<!doctype html><html><head><style>body{margin:0;background:#111;color:white;font:16px sans-serif}#arena{height:100vh}nav{position:fixed;z-index:5;top:8px;left:8px;background:#101824;padding:12px}button{padding:10px}output{display:block;max-width:650px}</style></head><body><nav><button id="start">Start paired clients</button><button id="stop">Stop</button><output id="status">Ready</output></nav><div id="arena"></div><script type="module">
import {decodeSnapshot} from '/src/wire.js';import {ArenaRenderer} from '/src/renderer.js';
const renderer=new ArenaRenderer(document.querySelector('#arena'));await renderer.load();renderer.setFollow(true);renderer.resize();
const clients=[],status=document.querySelector('#status');let last=performance.now();
function draw(now){if(clients[0]?.state)renderer.draw(clients[0].state,Math.min(.05,(now-last)/1000),0);last=now;requestAnimationFrame(draw)}requestAnimationFrame(draw);
function report(){status.textContent=clients.map((c,i)=>`Client ${i+1}: room ${c.room||'?'} tick ${c.state?.tick||0}, medical phases ${[...c.phases]}, injuries ${c.injuries}, replacements ${c.replacements}, minimum energy ${c.low}, events ${[...c.kinds]}`).join(' | ')}
async function connect(room){const cfg=await(await fetch('/connection.json')).json(),url=new URL(cfg.url);url.searchParams.set('room',room);url.searchParams.set('name','Network test '+(clients.length+1));const session=new WebTransport(url,cfg.hash?{serverCertificateHashes:[{algorithm:'sha-256',value:Uint8Array.from(cfg.hash)}]}:{});session.closed.catch(()=>{});await session.ready;
const c={session,phases:new Set(),kinds:new Set(),injuries:0,replacements:0,low:100,last:0,seq:0};clients.push(c);const writer=session.datagrams.writable.getWriter(),reader=session.datagrams.readable.getReader();let ready;const first=new Promise(r=>ready=r);
(async()=>{try{for(;;){const{value,done}=await reader.read();if(done)break;const m=decodeSnapshot(value);c.room=m.room;c.state=m.state;ready(c.room);const s=c.state;if(s.medical)c.phases.add(s.medical.phase);for(const e of s.events){if(e.id<=c.last)continue;c.last=e.id;c.kinds.add(e.kind);if(e.kind===14)c.injuries++;if(e.kind===15)c.replacements++}c.low=Math.min(c.low,...s.players.map(p=>p.health));report();const p=s.players[s.controlled[m.team]],sign=v=>Math.abs(v)<.05?0:Math.sign(v);await writer.write(new TextEncoder().encode(JSON.stringify({seq:c.seq++,x:sign(s.ball.x-p.x),z:sign(s.ball.z-p.z),tackle:s.tick%18<5,shoot:false,lob:false})));}}
catch(e){status.textContent+=' ERROR '+e.message}})();return first;}
document.querySelector('#start').onclick=async()=>{try{document.querySelector('#start').disabled=true;await connect(await connect(''))}catch(e){status.textContent=e.message}};
document.querySelector('#stop').onclick=()=>{for(const c of clients)c.session.close();status.textContent+=' STOPPED'};
</script></body></html>
