<!doctype html><html lang="en"><meta charset="utf-8"><title>Speedball pickup check</title>
<style>body{margin:0;background:#090f17;color:#e6ece8;font:14px system-ui}header{padding:12px;display:flex;gap:20px;align-items:center}button{padding:10px}#stage{height:80vh}output{display:block;padding:12px}</style>
<header><strong>Field item visual fixture</strong><button id="collect" disabled>Check coin collection</button><button id="upgrade" disabled>Check upgrade collection</button><span>Gold: credits · Blue: power-ups · Orange hex: attribute upgrades</span></header><div id="stage"></div><output role="status">Loading Blender assets…</output>
<script type="module">
import {ArenaRenderer} from '/src/renderer.js';
import {createMatch} from '/src/game.js';
import {featureStep} from '/src/features.js';
import {equipmentMessage,pickupMessage} from '/src/pickup-feedback.js';
const s=createMatch({training:true}),view=new ArenaRenderer(document.querySelector('#stage')),status=document.querySelector('output'),button=document.querySelector('button');
s.pickups.forEach((item,i)=>Object.assign(item,{kind:[1,4,13,13,13,13,17][i],x:(Math.floor(i/3)-1)*3,z:(i%3-1)*4,wait:0}));
await view.load();view.setFollow(true);view.resize();button.disabled=false;document.querySelector('#upgrade').disabled=false;status.textContent='Seven representative items shown with the production match renderer. Collection uses a fixture position and the actual pickup handler.';
button.onclick=()=>{const p=s.players[s.controlled[0]],coin=s.pickups[2];p.x=coin.x;p.z=coin.z;p.action=0;p.stun=0;featureStep(s,.04);status.textContent=`Coin collected: credits ${s.credits[0]}, respawn delay ${coin.wait.toFixed(2)} seconds`;button.disabled=true};
document.querySelector('#upgrade').onclick=()=>{const p=s.players[s.controlled[0]],item=s.pickups[6];p.x=item.x;p.z=item.z;p.action=0;p.stun=0;featureStep(s,.04);status.textContent=pickupMessage(s.event,0)+' · '+equipmentMessage(p);document.querySelector('#upgrade').disabled=true};
let last=performance.now();function draw(now){const dt=Math.min((now-last)/1000,.05);last=now;view.draw(s,dt,0);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
